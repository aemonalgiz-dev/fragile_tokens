[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fragile-tokens"
version = "0.1.0"
description = "Detect tokens that pass single-token glitch probes but fail to copy inside ordinary text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeffrey R. Gordon", email = "jeffreyrgordon@gmail.com" }]
keywords = ["glitch tokens", "fragile tokens", "tokenizer", "language models", "robustness"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "transformers>=4.40",
    "safetensors>=0.4",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
gpu = ["accelerate>=0.26", "bitsandbytes>=0.43"]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
fragile-tokens = "fragile_tokens.cli:main"

[project.urls]
Homepage = "https://medium.com/p/0270e70c72a6"

[tool.setuptools]
packages = ["fragile_tokens"]

[tool.setuptools.package-data]
fragile_tokens = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["fragile_tokens"]

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*", "huggingface_hub", "huggingface_hub.*", "safetensors", "safetensors.*", "accelerate"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "fragile_tokens.models"
disallow_untyped_calls = false
warn_return_any = false
disallow_any_generics = false
